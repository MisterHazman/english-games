<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tug of War — English Game</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💪</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="common.css">
<style>
.arena{
  margin-top:clamp(12px, 2vw, 24px);
  background:rgba(255,255,255,0.04);
  border:2px solid var(--board-line);
  border-radius:1.1rem;
  padding:clamp(12px, 2vw, 28px);
}
.track{ position:relative; height:4.5rem; margin:0.6rem 1.5rem 0; }
.zone{ position:absolute; top:0; bottom:0; width:10%; border-radius:0.6rem; background:var(--c); opacity:0.45; }
.zone.left{ left:-1.5rem; } .zone.right{ right:-1.5rem; }
.rope{
  position:absolute; left:-1.5rem; right:-1.5rem; top:50%; height:0.9rem; margin-top:-0.45rem;
  border-radius:999px;
  background:repeating-linear-gradient(60deg, #C8A165 0 10px, #9C7440 10px 20px);
}
.step-dot{ position:absolute; top:50%; width:4px; height:2.2rem; margin:-1.1rem 0 0 -2px; background:var(--board-line); border-radius:2px; }
.step-dot.mid{ background:var(--chalk); height:3.2rem; margin-top:-1.6rem; }
.marker{
  position:absolute; top:50%; left:50%;
  font-size:3.4rem; line-height:1;
  transform:translate(-50%, -50%);
  transition:left 0.5s cubic-bezier(.3,1.5,.5,1);
  filter:drop-shadow(0 4px 6px rgba(0,0,0,0.5));
}
.pulls{ display:flex; justify-content:space-between; gap:1rem; }
.pulls button{ flex:1; font-family:var(--font-display); font-weight:800; font-size:1.5rem; padding:0.7rem; overflow-wrap:anywhere; }
.pull-left{ background:var(--c1); color:#1F2E28; }
.pull-right{ background:var(--c2); color:#1F2E28; }
</style>
</head>
<body>

<div class="app">
  <header class="topbar" id="topbar"></header>

  <div class="setup" id="setup"></div>

  <main id="game" class="hidden">
    <div class="stage">
      <div class="stage-label">Spell it or say it!</div>
      <div class="question-text" id="questionText"></div>
      <div class="answer-text" id="answerText"></div>
      <div class="controls">
        <button class="btn-ghost btn-big" id="prevBtn">← Previous</button>
        <button class="btn-ghost btn-big" id="answerBtn">Show Answer</button>
        <button class="btn-primary btn-big" id="nextBtn">Next Question →</button>
      </div>
    </div>

    <div class="arena">
      <div class="pulls">
        <button class="pull-left" id="pullLeft"></button>
        <button class="pull-right" id="pullRight"></button>
      </div>
      <div class="track" id="track">
        <div class="zone left" id="zoneLeft"></div>
        <div class="zone right" id="zoneRight"></div>
        <div class="rope"></div>
        <div class="marker" id="marker" aria-hidden="true">🎀</div>
      </div>
    </div>
  </main>

  <div class="footer-note">The team that answers first pulls the rope one step. Pull it all the way to your side to win!</div>
</div>

<script src="common.js"></script>
<script src="sets/tug-of-war.js"></script>
<script>
/* ============================================================
   BUILT-IN QUESTIONS — spelling and vocabulary
   (Year 4, 5, 6 — KSSR / CEFR A1–A2)
   ============================================================ */
const BANKS = {
  4: [
    { q: "Spell the word: 🐘", a: "E-L-E-P-H-A-N-T", category: "Vocabulary" },
    { q: "Spell the word: 🍌", a: "B-A-N-A-N-A", category: "Vocabulary" },
    { q: "Fill in the missing letters: b _ t t _ r f l y", a: "BUTTERFLY (u, e)", category: "Vocabulary" },
    { q: "Spell the day that comes after Monday.", a: "T-U-E-S-D-A-Y", category: "Vocabulary" },
    { q: "Spell the number 12.", a: "T-W-E-L-V-E", category: "Vocabulary" },
    { q: "What is the opposite of \"fast\"? Spell it.", a: "S-L-O-W", category: "Vocabulary" },
    { q: "Spell the word: 🏫", a: "S-C-H-O-O-L", category: "Vocabulary" },
    { q: "Fill in the missing letters: t _ a c h _ r (a person who works in a school)", a: "TEACHER (e, e)", category: "Vocabulary" },
    { q: "What colour is the sky on a sunny day? Spell it.", a: "B-L-U-E", category: "Vocabulary" },
    { q: "Spell the word: 🐟", a: "F-I-S-H", category: "Vocabulary" },
    { q: "Put the letters in order: R  I  B  D", a: "BIRD", category: "Vocabulary" },
    { q: "Spell the word: 🚌", a: "B-U-S", category: "Vocabulary" },
    { q: "In which room do we cook? Spell it.", a: "K-I-T-C-H-E-N", category: "Vocabulary" },
    { q: "Spell the word: 🦁", a: "L-I-O-N", category: "Vocabulary" },
    { q: "Fill in the missing letters: S a t _ r d _ y", a: "SATURDAY (u, a)", category: "Vocabulary" },
    { q: "Spell the number 20.", a: "T-W-E-N-T-Y", category: "Vocabulary" },
    { q: "Spell the word: 🍎", a: "A-P-P-L-E", category: "Vocabulary" },
    { q: "What do you drink when you are thirsty? Spell it.", a: "W-A-T-E-R", category: "Vocabulary" },
    { q: "Put the letters in order: S  E  O  U  H", a: "HOUSE", category: "Vocabulary" },
    { q: "Spell the word: 🌧️", a: "R-A-I-N", category: "Vocabulary" },
    { q: "What is the opposite of \"happy\"? Spell it.", a: "S-A-D", category: "Vocabulary" },
    { q: "Spell the word: 🐸", a: "F-R-O-G", category: "Vocabulary" }
  ],
  5: [
    { q: "Spell the word: 🦒", a: "G-I-R-A-F-F-E", category: "Vocabulary" },
    { q: "Spell the month that comes after June.", a: "J-U-L-Y", category: "Vocabulary" },
    { q: "Fill in the missing letters: W e d n _ s d _ y", a: "WEDNESDAY (e, a)", category: "Vocabulary" },
    { q: "Spell the word: ☂️", a: "U-M-B-R-E-L-L-A", category: "Vocabulary" },
    { q: "Put the letters in order: N  A  I  R  T", a: "TRAIN", category: "Vocabulary" },
    { q: "Spell the past tense of \"go\".", a: "W-E-N-T", category: "Tenses" },
    { q: "Spell the plural of \"child\".", a: "C-H-I-L-D-R-E-N", category: "Grammar" },
    { q: "Spell the word: 🚲", a: "B-I-C-Y-C-L-E", category: "Vocabulary" },
    { q: "What is the opposite of \"heavy\"? Spell it.", a: "L-I-G-H-T", category: "Vocabulary" },
    { q: "Spell the number 15.", a: "F-I-F-T-E-E-N", category: "Vocabulary" },
    { q: "Fill in the missing letters: b _ a u t i f _ l", a: "BEAUTIFUL (e, u)", category: "Vocabulary" },
    { q: "Put the letters in order: N  D  I  R  F  E", a: "FRIEND", category: "Vocabulary" },
    { q: "Spell the word: 🐢", a: "T-U-R-T-L-E (or T-O-R-T-O-I-S-E)", category: "Vocabulary" },
    { q: "Which season is very cold and has snow? Spell it.", a: "W-I-N-T-E-R", category: "Vocabulary" },
    { q: "Spell the past tense of \"eat\".", a: "A-T-E", category: "Tenses" },
    { q: "Spell the word: ⚽", a: "F-O-O-T-B-A-L-L", category: "Vocabulary" },
    { q: "What do we call the meal we eat at night? Spell it.", a: "D-I-N-N-E-R", category: "Vocabulary" },
    { q: "Fill in the missing letters: l i b r _ r _", a: "LIBRARY (a, y)", category: "Vocabulary" },
    { q: "Spell the missing word: big, ______, biggest", a: "B-I-G-G-E-R", category: "Grammar" },
    { q: "Put the letters in order: E  A  C  H  B", a: "BEACH", category: "Vocabulary" },
    { q: "Spell the word: 🐧", a: "P-E-N-G-U-I-N", category: "Vocabulary" },
    { q: "Spell the plural of \"box\".", a: "B-O-X-E-S", category: "Grammar" }
  ],
  6: [
    { q: "Spell the word: 🦷", a: "T-O-O-T-H", category: "Vocabulary" },
    { q: "Spell the plural of \"tooth\".", a: "T-E-E-T-H", category: "Grammar" },
    { q: "Spell the past tense of \"buy\".", a: "B-O-U-G-H-T", category: "Tenses" },
    { q: "Fill in the missing letters: e n v _ r o n m _ n t", a: "ENVIRONMENT (i, e)", category: "Vocabulary" },
    { q: "Spell the word: 🌍", a: "E-A-R-T-H (or W-O-R-L-D)", category: "Vocabulary" },
    { q: "Put the letters in order: C  E  S  I  C  N  E", a: "SCIENCE", category: "Vocabulary" },
    { q: "What is the opposite of \"dangerous\"? Spell it.", a: "S-A-F-E", category: "Vocabulary" },
    { q: "Spell the word: 🚑", a: "A-M-B-U-L-A-N-C-E", category: "Vocabulary" },
    { q: "Spell the missing word: happy, happier, ______", a: "H-A-P-P-I-E-S-T", category: "Grammar" },
    { q: "Fill in the missing letters: c o m p _ t _ r", a: "COMPUTER (u, e)", category: "Vocabulary" },
    { q: "Spell the number 40.", a: "F-O-R-T-Y", category: "Vocabulary" },
    { q: "Spell the word: 🌋", a: "V-O-L-C-A-N-O", category: "Vocabulary" },
    { q: "Put the letters in order: T  R  E  C  Y  E  L", a: "RECYCLE", category: "Vocabulary" },
    { q: "Spell the past tense of \"write\".", a: "W-R-O-T-E", category: "Tenses" },
    { q: "Spell the word: 🚀", a: "R-O-C-K-E-T", category: "Vocabulary" },
    { q: "Who looks after our teeth? Spell it.", a: "D-E-N-T-I-S-T", category: "Vocabulary" },
    { q: "Fill in the missing letters: v _ g _ t a b l e s", a: "VEGETABLES (e, e)", category: "Vocabulary" },
    { q: "Spell the word: 🔥", a: "F-I-R-E", category: "Vocabulary" },
    { q: "Spell the month that comes after September.", a: "O-C-T-O-B-E-R", category: "Vocabulary" },
    { q: "Put the letters in order: L  A  T  I  P  S  O  H", a: "HOSPITAL", category: "Vocabulary" },
    { q: "Change \"careful\" to an adverb and spell it. (She walks ______.)", a: "C-A-R-E-F-U-L-L-Y", category: "Grammar" },
    { q: "Spell the word: 🏔️", a: "M-O-U-N-T-A-I-N", category: "Vocabulary" }
  ]
};

/* ============================================================
   GAME
   ============================================================ */
let teams = [], questions = [], index = 0, pos = 0, steps = 5, wonBy = [], gameOver = false;
// pos: -steps = left team wins, 0 = middle, +steps = right team wins

const $ = id => document.getElementById(id);
const questionText = $("questionText"), answerText = $("answerText");
const prevBtn = $("prevBtn"), nextBtn = $("nextBtn"), answerBtn = $("answerBtn");
const pullLeft = $("pullLeft"), pullRight = $("pullRight"), marker = $("marker"), track = $("track");

function startGame(game){
  teams = game.teams.map(t => ({ ...t, pulls: 0 }));
  questions = game.questions;
  steps = game.options.steps;
  index = 0; pos = 0; gameOver = false;
  wonBy = questions.map(() => null);   // which team won each question

  $("zoneLeft").style.setProperty("--c", teams[0].color);
  $("zoneRight").style.setProperty("--c", teams[1].color);
  document.body.style.setProperty("--c1", teams[0].color);
  document.body.style.setProperty("--c2", teams[1].color);

  track.querySelectorAll(".step-dot").forEach(d => d.remove());
  for (let s = -steps; s <= steps; s++){
    track.append(EG.h("div", { className: "step-dot" + (s === 0 ? " mid" : ""), style: `left:${50 + s * 50 / steps}%` }));
  }
  render();
}

function render(){
  const q = questions[index];
  questionText.textContent = q.q;
  answerText.textContent = q.a;
  answerText.classList.remove("shown");
  answerBtn.textContent = "Show Answer";
  prevBtn.disabled = index === 0;
  nextBtn.textContent = index === questions.length - 1 ? "🏁 See the winner" : "Next Question →";
  nextBtn.disabled = gameOver;
  EG.setCounter(`Question ${index + 1} / ${questions.length}`);

  marker.style.left = `${50 + pos * 50 / steps}%`;
  const won = wonBy[index];
  pullLeft.textContent = won === 0 ? `✔ ${teams[0].name} pulled` : `⬅ ${teams[0].name} got it!`;
  pullRight.textContent = won === 1 ? `✔ ${teams[1].name} pulled` : `${teams[1].name} got it! ➡`;
  pullLeft.disabled = gameOver || won === 0;
  pullRight.disabled = gameOver || won === 1;
}

// one pull per question; tapping the other team instead moves that pull to them
function pull(t){
  const before = wonBy[index];
  if (before === t || gameOver) return;
  if (before !== null){ teams[before].pulls--; pos -= before === 0 ? -1 : 1; }
  wonBy[index] = t;
  teams[t].pulls++;
  pos += t === 0 ? -1 : 1;
  EG.sfx.whoosh();
  EG.sfx.correct();
  render();
  if (Math.abs(pos) >= steps){
    gameOver = true;
    render();
    const winner = teams[pos < 0 ? 0 : 1];
    setTimeout(() => EG.showWinner(`🎉 ${winner.name} wins! 🎉`, teams.map(t => `${t.name}: ${EG.plural(t.pulls, ["pull", "pulls"])}`), "They pulled the rope all the way!"), 700);
  }
}

function finish(){
  gameOver = true;
  render();
  EG.winnerByScore(teams, t => t.pulls, ["pull", "pulls"], "The rope is closer to their side.");
}

answerBtn.onclick = () => {
  const shown = answerText.classList.toggle("shown");
  answerBtn.textContent = shown ? "Hide Answer" : "Show Answer";
};
prevBtn.onclick = () => { if (index > 0){ index--; render(); } };
nextBtn.onclick = () => { if (index < questions.length - 1){ index++; render(); } else finish(); };
pullLeft.onclick = () => pull(0);
pullRight.onclick = () => pull(1);

EG.init({
  id: "tug-of-war",
  titleHTML: `<span class="drip">TUG</span> of War`,
  banks: BANKS,
  moreSets: MORE_SETS,
  fields: [{ key: "q", label: "Question", grow: 3 }, { key: "a", label: "Answer", grow: 2 }, { key: "category", label: "Category", optional: true }],
  minTeams: 2, maxTeams: 2,
  editorHint: "Category: Vocabulary, Grammar, Tenses or Prepositions (or any word you like) — it decides the tick boxes.",
  options: [{ key: "steps", label: "Pulls needed to win", choices: [3, 5, 7], default: 5, unit: "pulls" }],
  howTo: "Two teams. Read the question — the first team to answer correctly pulls the rope one step. Pull the rope all the way to your side to win!",
  start: startGame,
  finish
});
</script>

</body>
</html>
