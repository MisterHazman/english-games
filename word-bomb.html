<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Word Bomb — English Game</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💣</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="common.css">
<style>
.turn-label{ font-family:var(--font-display); font-weight:800; font-size:1.8rem; line-height:1.2; color:var(--c); margin-bottom:0.3rem; overflow-wrap:anywhere; }
.bomb-row{ display:flex; align-items:center; justify-content:center; gap:1.5rem; margin:0.4rem 0 0; flex-wrap:wrap; }
.bomb{ position:relative; font-size:4rem; line-height:1; width:5.4rem; text-align:center; }
.bomb.urgent{ animation:pulse 0.5s ease-in-out infinite; }
.bomb.boom{ animation:boom 0.6s ease-out; }
@keyframes pulse{ 50%{ transform:scale(1.12); filter:drop-shadow(0 0 18px #E6484D); } }
@keyframes boom{ 0%{ transform:scale(0.3); } 60%{ transform:scale(1.5) rotate(10deg); } 100%{ transform:scale(1); } }
.count{ font-family:var(--font-display); font-weight:800; font-size:3.8rem; line-height:1; min-width:3ch; }
.count.urgent{ color:#ff7a7e; }
.fuse{ height:0.9rem; max-width:36rem; margin:0.4rem auto 0; background:rgba(255,255,255,0.1); border-radius:999px; overflow:hidden; }
.fuse div{ height:100%; width:100%; background:linear-gradient(90deg, #E6484D, #FFC145); transition:width 0.1s linear; }
.result{ font-family:var(--font-display); font-weight:800; font-size:2rem; margin-top:0.4rem; }
.result:empty{ display:none; }
.answer-label{ font-size:1rem; color:var(--chalk-dim); display:block; font-family:var(--font-body); font-weight:600; }
#scores{ margin-top:clamp(12px, 2vw, 24px); }
</style>
</head>
<body>

<div class="app">
  <header class="topbar" id="topbar"></header>

  <div class="setup" id="setup"></div>

  <main id="game" class="hidden">
    <div class="stage">
      <div class="turn-label" id="turn"></div>
      <div class="question-text" id="prompt"></div>
      <div class="bomb-row">
        <div class="bomb" id="bomb" aria-hidden="true">💣</div>
        <div class="count" id="count" aria-live="off"></div>
      </div>
      <div class="fuse"><div id="fuse"></div></div>
      <div class="result" id="result" aria-live="polite"></div>
      <div class="answer-text" id="answerText"></div>
      <div class="controls">
        <button class="btn-ghost btn-big" id="prevBtn">← Previous</button>
        <button class="btn-primary btn-big" id="startBtn">▶ Start timer</button>
        <button class="btn-ok btn-big" id="correctBtn">✅ Correct</button>
        <button class="btn-ghost btn-big" id="answerBtn">Show Answer</button>
        <button class="btn-ghost btn-big" id="nextBtn">Skip →</button>
      </div>
    </div>

    <div id="scores"></div>
  </main>

  <div class="footer-note">Answer before the bomb explodes! Correct = 1 point. Bomb explodes = lose a life. Lose all your lives and your team is out.</div>
</div>

<script src="common.js"></script>
<script>
/* ============================================================
   BUILT-IN PROMPTS — categories and quick questions
   (Year 4, 5, 6 — KSSR / CEFR A1–A2)
   ============================================================ */
const BANKS = {
  4: [
    { prompt: "Name 3 animals that live in the sea.", answer: "fish, shark, crab, octopus, whale…" },
    { prompt: "Name 3 fruits.", answer: "apple, banana, mango, orange, durian…" },
    { prompt: "Name 3 colours.", answer: "red, blue, green, yellow, pink…" },
    { prompt: "Name 4 days of the week.", answer: "Monday, Tuesday, Wednesday, Thursday, Friday, Saturday, Sunday" },
    { prompt: "Name 3 things in your school bag.", answer: "book, pencil, ruler, eraser, pencil case…" },
    { prompt: "Name 3 parts of the body.", answer: "head, hand, leg, eye, nose, mouth…" },
    { prompt: "Name 3 things you can see in the classroom.", answer: "table, chair, board, door, window, fan…" },
    { prompt: "What is the opposite of \"tall\"?", answer: "short" },
    { prompt: "Name 3 animals with four legs.", answer: "cat, dog, cow, goat, elephant, tiger…" },
    { prompt: "Name 3 jobs.", answer: "teacher, doctor, farmer, police officer, cook…" },
    { prompt: "Name 3 things you can eat for breakfast.", answer: "bread, eggs, nasi lemak, roti canai, cereal…" },
    { prompt: "Name 3 sports.", answer: "football, badminton, swimming, netball, running…" },
    { prompt: "Count from 11 to 15 in English.", answer: "eleven, twelve, thirteen, fourteen, fifteen" },
    { prompt: "Name 3 rooms in a house.", answer: "kitchen, bedroom, bathroom, living room…" },
    { prompt: "Name 3 people in a family.", answer: "mother, father, sister, brother, grandmother…" },
    { prompt: "Name 3 things that are green.", answer: "leaf, grass, frog, tree, cucumber…" },
    { prompt: "Name 3 ways to travel.", answer: "car, bus, bicycle, train, aeroplane, boat…" },
    { prompt: "Name 3 drinks.", answer: "water, milk, juice, tea, Milo…" },
    { prompt: "What is the opposite of \"clean\"?", answer: "dirty" },
    { prompt: "Name 3 hobbies.", answer: "reading, drawing, swimming, singing, cycling…" },
    { prompt: "Name 3 animals that can fly.", answer: "bird, butterfly, bee, bat, eagle…" },
    { prompt: "Say a sentence with the word \"can\".", answer: "Any correct sentence, e.g. \"I can swim.\"" }
  ],
  5: [
    { prompt: "Name 3 kinds of weather.", answer: "sunny, rainy, cloudy, windy, stormy…" },
    { prompt: "Name 4 months of the year.", answer: "January, February, March, April, May…" },
    { prompt: "Say the past tense of: go, eat, see.", answer: "went, ate, saw" },
    { prompt: "Name 3 things you take to the beach.", answer: "hat, towel, sunglasses, ball, water…" },
    { prompt: "Name 3 places in a town.", answer: "shop, bank, hospital, mosque, library, post office…" },
    { prompt: "Name 3 musical instruments.", answer: "piano, guitar, drum, violin, recorder…" },
    { prompt: "Name 3 things in a kitchen.", answer: "stove, fridge, plate, pot, spoon, cup…" },
    { prompt: "Say the opposite of: early, cheap, heavy.", answer: "late, expensive, light" },
    { prompt: "Name 3 animals that live in the jungle.", answer: "tiger, monkey, snake, elephant, orang utan…" },
    { prompt: "Name 3 clothes you wear.", answer: "shirt, shoes, skirt, trousers, hat, socks…" },
    { prompt: "Say a sentence about what you did yesterday.", answer: "Any correct past-tense sentence, e.g. \"I played football yesterday.\"" },
    { prompt: "Name 3 vegetables.", answer: "carrot, cabbage, spinach, potato, tomato…" },
    { prompt: "Name 3 things that are hot.", answer: "sun, fire, hot drink, soup, stove…" },
    { prompt: "Compare two animals. Use \"bigger than\".", answer: "e.g. \"An elephant is bigger than a cat.\"" },
    { prompt: "Name 3 healthy foods.", answer: "fruit, vegetables, fish, rice, eggs, milk…" },
    { prompt: "Name 3 things you do every morning.", answer: "wake up, brush my teeth, take a bath, eat breakfast…" },
    { prompt: "Name 3 sports you play with a ball.", answer: "football, basketball, volleyball, netball, tennis…" },
    { prompt: "Say the plural of: child, mouse, foot.", answer: "children, mice, feet" },
    { prompt: "Name 3 festivals in Malaysia.", answer: "Hari Raya, Chinese New Year, Deepavali, Christmas, Gawai…" },
    { prompt: "Name 3 insects.", answer: "ant, bee, butterfly, mosquito, fly…" },
    { prompt: "Name 3 shapes.", answer: "circle, square, triangle, rectangle, star…" },
    { prompt: "Name 3 things you can buy at a market.", answer: "fish, vegetables, fruit, chicken, eggs…" }
  ],
  6: [
    { prompt: "Name 3 things we can recycle.", answer: "paper, plastic bottles, cans, glass, boxes…" },
    { prompt: "Name 3 ways to stay healthy.", answer: "exercise, eat vegetables, sleep early, drink water…" },
    { prompt: "Name 3 jobs in a hospital.", answer: "doctor, nurse, dentist, cleaner, pharmacist…" },
    { prompt: "Say the past tense of: buy, write, think.", answer: "bought, wrote, thought" },
    { prompt: "Name 3 planets.", answer: "Earth, Mars, Jupiter, Venus, Saturn, Mercury…" },
    { prompt: "Name 3 things that use electricity.", answer: "TV, computer, fan, fridge, lamp, phone…" },
    { prompt: "Name 3 countries.", answer: "Malaysia, Japan, China, Thailand, Indonesia…" },
    { prompt: "Say a sentence about tomorrow. Use \"will\".", answer: "e.g. \"I will visit my grandmother tomorrow.\"" },
    { prompt: "Name 3 things you pack for a holiday.", answer: "clothes, toothbrush, towel, camera, hat…" },
    { prompt: "Name 3 states in Malaysia.", answer: "Selangor, Johor, Sabah, Sarawak, Kedah, Perak…" },
    { prompt: "Say the superlative of: big, good, happy.", answer: "biggest, best, happiest" },
    { prompt: "Name 3 ways to save water.", answer: "turn off the tap, take a short shower, fix leaking pipes…" },
    { prompt: "Name 3 things you can do with a phone.", answer: "call, take photos, send messages, play games…" },
    { prompt: "Name 3 animals that we must protect (endangered animals).", answer: "Malayan tiger, orang utan, sea turtle, elephant, tapir…" },
    { prompt: "Name 3 words that describe a good friend.", answer: "kind, friendly, helpful, honest, funny…" },
    { prompt: "What should you do if there is a fire?", answer: "stay calm, get out quickly, call 999, do not use the lift" },
    { prompt: "Name 3 school subjects.", answer: "English, Maths, Science, Bahasa Melayu, Art…" },
    { prompt: "Name 3 things you can see in the sky.", answer: "sun, moon, stars, clouds, birds, aeroplane…" },
    { prompt: "Make a sentence with \"because\".", answer: "e.g. \"I am happy because it is my birthday.\"" },
    { prompt: "Name 3 kinds of transport for long journeys.", answer: "aeroplane, train, ship, bus, car…" },
    { prompt: "Say the opposite of: polite, safe, careful.", answer: "rude, dangerous, careless" },
    { prompt: "Name 3 things that make the air or rivers dirty.", answer: "smoke, rubbish, cars, factories, plastic…" }
  ]
};

/* ============================================================
   GAME
   ============================================================ */
const LIVES = 3;
let teams = [], prompts = [], index = 0, turn = 0, seconds = 20, gameOver = false;
let state = "ready";   // ready | running | correct | boom
let timer = null, endsAt = 0, lastSec = 0;

const $ = id => document.getElementById(id);
const startBtn = $("startBtn"), correctBtn = $("correctBtn"), answerBtn = $("answerBtn");
const prevBtn = $("prevBtn"), nextBtn = $("nextBtn"), answerText = $("answerText");

function startGame(game){
  teams = game.teams.map(t => ({ ...t, score: 0, lives: LIVES, out: false }));
  prompts = game.questions;
  seconds = game.options.seconds;
  index = 0; turn = 0; gameOver = false;
  newTurn();
}

function newTurn(){
  stopTimer();
  state = "ready";
  $("count").textContent = seconds;
  $("fuse").style.width = "100%";
  render();
}

function render(){
  const team = teams[turn], p = prompts[index], done = state === "correct" || state === "boom";
  $("turn").textContent = `🎯 ${team.name} — your turn!`;
  $("turn").style.setProperty("--c", team.color);
  $("prompt").textContent = p.prompt;
  answerText.innerHTML = `<span class="answer-label">Possible answers</span>${EG.esc(p.answer)}`;
  if (done) answerText.classList.add("shown");
  if (state === "ready") answerText.classList.remove("shown");
  answerBtn.textContent = answerText.classList.contains("shown") ? "Hide Answer" : "Show Answer";

  $("bomb").textContent = state === "boom" ? "💥" : "💣";
  $("bomb").classList.toggle("boom", state === "boom");
  $("result").textContent = state === "boom" ? `BOOM! ${team.name} loses a life.` : state === "correct" ? `Well done! +1 point for ${team.name}` : "";

  startBtn.disabled = state !== "ready" || gameOver;
  correctBtn.disabled = done || gameOver;
  prevBtn.disabled = index === 0 || gameOver;
  const isLast = index === prompts.length - 1;
  nextBtn.textContent = isLast ? "🏁 See the winner" : done ? "Next turn →" : "Skip question →";
  nextBtn.className = done ? "btn-primary btn-big" : "btn-ghost btn-big";
  nextBtn.disabled = gameOver;
  EG.setCounter(`Question ${index + 1} / ${prompts.length}`);

  teams.forEach((t, i) => t.turn = i === turn && !gameOver);
  EG.scoreboard($("scores"), teams, {
    score: t => t.score,
    extra: t => t.out ? "OUT" : "❤️".repeat(t.lives) + "🖤".repeat(LIVES - t.lives)
  });
}

/* ---------------- timer ---------------- */
function startTimer(){
  if (state !== "ready" || gameOver) return;
  state = "running";
  endsAt = performance.now() + seconds * 1000;
  lastSec = seconds + 1;
  timer = setInterval(tick, 100);
  tick();
  render();
}
function tick(){
  const left = Math.max(0, endsAt - performance.now());
  const sec = Math.ceil(left / 1000);
  if (sec !== lastSec){
    lastSec = sec;
    if (sec > 0) EG.sfx.tick(sec <= 3);
  }
  $("count").textContent = sec;
  $("count").classList.toggle("urgent", sec <= 3);
  $("bomb").classList.toggle("urgent", sec <= 3 && left > 0);
  $("fuse").style.width = `${left / (seconds * 10)}%`;
  if (left <= 0) explode();
}
function stopTimer(){
  clearInterval(timer);
  timer = null;
  $("bomb").classList.remove("urgent");
  $("count").classList.remove("urgent");
}

/* ---------------- results ---------------- */
function correct(){
  if (state === "correct" || state === "boom" || gameOver) return;
  stopTimer();
  state = "correct";
  teams[turn].score++;
  EG.sfx.correct();
  render();
  EG.bump(turn);
}

function explode(){
  stopTimer();
  state = "boom";
  const team = teams[turn];
  team.lives--;
  if (team.lives <= 0) team.out = true;
  EG.sfx.boom();
  render();
  const alive = teams.filter(t => !t.out);
  if (alive.length === 1){
    gameOver = true;
    render();
    setTimeout(() => EG.showWinner(`🎉 ${alive[0].name} wins! 🎉`,
      teams.map(t => `${t.name}: ${EG.plural(t.score, ["point", "points"])}${t.out ? " (out)" : ""}`),
      "They are the last team still in the game!"), 1300);
  }
}

function nextTeam(){
  // the turn passes to the next team that is not out
  for (let step = 1; step <= teams.length; step++){
    const t = (turn + step) % teams.length;
    if (!teams[t].out) return t;
  }
  return turn;
}

function finish(){
  stopTimer();
  gameOver = true;
  render();
  const inGame = teams.filter(t => !t.out);
  EG.winnerByScore(inGame, t => t.score, ["point", "points"], "The team with the most points wins.");
}

startBtn.onclick = startTimer;
correctBtn.onclick = correct;
answerBtn.onclick = () => {
  const shown = answerText.classList.toggle("shown");
  answerBtn.textContent = shown ? "Hide Answer" : "Show Answer";
};
prevBtn.onclick = () => { if (index > 0){ index--; newTurn(); } };
nextBtn.onclick = () => {
  if (index === prompts.length - 1) return finish();
  const done = state === "correct" || state === "boom";
  index++;
  if (done) turn = nextTeam();
  newTurn();
};

EG.init({
  id: "word-bomb",
  titleHTML: `<span class="drip">Word</span> Bomb 💣`,
  banks: BANKS,
  fields: [{ key: "prompt", label: "Question or category", grow: 3 }, { key: "answer", label: "Possible answers", grow: 2 }],
  options: [{ key: "seconds", label: "Time for each turn", choices: [10, 20, 30], default: 20, unit: "seconds" }],
  howTo: "Teams take turns. Read the question, then start the timer. Tap ✅ Correct before the bomb explodes to win 1 point. If it explodes, the team loses a life. Lose 3 lives and you are out!",
  start: startGame,
  stop: stopTimer,
  finish
});
</script>

</body>
</html>
